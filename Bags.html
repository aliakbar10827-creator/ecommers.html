<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecommerce</title>

  <!-- ✅ Tailwind v2 -->
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>

<!-- ===== HEADER ===== -->
<!-- ===== HEADER ===== -->
<header class="bg-white text-gray-800 body-font shadow-lg">
  <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center justify-between">
    
    <!-- Logo -->
    <a class="flex title-font font-medium items-center mb-4 md:mb-0">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"
        stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        class="w-10 h-10 text-yellow-500 p-2 bg-gray-800 rounded-full"
        viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
      </svg>
      <span class="ml-3 text-2xl font-bold">Daraz</span>
    </a>

    <!-- Navigation -->
    <nav class="flex flex-wrap items-center text-base justify-center space-x-6 md:ml-0">
      <a class="hover:text-yellow-500 transition-colors font-medium">Home</a>
      <a class="hover:text-yellow-500 transition-colors font-medium">Shop</a>
      <a class="hover:text-yellow-500 transition-colors font-medium">About</a>
      <a class="hover:text-yellow-500 transition-colors font-medium">Contact</a>
    </nav>

    <!-- Sign in button -->
    <button class="inline-flex items-center bg-yellow-500 border-0 py-2 px-6 focus:outline-none hover:bg-yellow-600 rounded text-white mt-4 md:mt-0 transition-all">
      Sign In
    </button>
  </div>
</header>

<!-- ==== Header ended ==== -->

<!-- ===== PRODUCT SECTION ===== -->
<section class="text-gray-600 body-font overflow-hidden">
  <div class="container px-5 py-16 mx-auto">

    <!-- Product Card -->
    <div class="lg:w-4/5 mx-auto flex flex-wrap border border-gray-200 rounded-lg shadow-sm p-6">

          <!-- IMAGE -->
      <div class="lg:w-1/2 w-full flex flex-col items-center bg-gray-100 p-6 rounded-lg">
        
        <!-- Main Big Image -->
        <img
          id="mainImage"
          loading="eager"
          alt="Product"
          class="w-full h-96 object-contain rounded-lg border border-gray-300 shadow-md hover:scale-105 transition-transform mb-4"
          src="https://img.drz.lazcdn.com/g/kf/Sddfb51d3f1b1468c9e943e1c01229fe4F.jpg_200x200q80.jpg_.avif">

        <!-- Small Thumbnail Images -->
        <div class="flex gap-3 mt-4">
          <img onclick="document.getElementById('mainImage').src=this.src"
               class="w-16 h-16 object-contain border border-gray-300 rounded-md cursor-pointer hover:ring-2 hover:ring-yellow-500 transition-all"
               src="laptopimage1.jpg" alt="Thumb 1">

          <img onclick="document.getElementById('mainImage').src=this.src"
               class="w-16 h-16 object-contain border border-gray-300 rounded-md cursor-pointer hover:ring-2 hover:ring-yellow-500 transition-all"
               src="laptopimage2.jpg" alt="Thumb 2">

          <img onclick="document.getElementById('mainImage').src=this.src"
               class="w-16 h-16 object-contain border border-gray-300 rounded-md cursor-pointer hover:ring-2 hover:ring-yellow-500 transition-all"
               src="laptopimage3.jpg" alt="Thumb 3">

          <img onclick="document.getElementById('mainImage').src=this.src"
               class="w-16 h-16 object-contain border border-gray-300 rounded-md cursor-pointer hover:ring-2 hover:ring-yellow-500 transition-all"
               src="laptopimage4.jpg" alt="Thumb 4">
          <img onclick="document.getElementById('mainImage').src=this.src"
               class="w-16 h-16 object-contain border border-gray-300 rounded-md cursor-pointer hover:ring-2 hover:ring-yellow-500 transition-all"
               src="laptopimage5.jpg" alt="Thumb 5">
        </div>
      </div>

      <!-- Product Details -->
      <div class="lg:w-1/2 w-full lg:pl-10 mt-6 lg:mt-0">
        <h2 class="text-sm title-font text-gray-500 tracking-widest">
         Backpack
        </h2>

        <h1 class="text-gray-900 text-3xl title-font font-medium mb-2">
         Travel Backpack
        </h1>

        <!-- Rating -->
        <div class="flex mb-4 text-yellow-500">
          ⭐⭐⭐⭐☆
          <span class="text-gray-600 ml-3">4 Reviews</span>
        </div>

        <!-- Description -->
        <p class="leading-relaxed mb-5">
          Durable and stylish laptop bag suitable for office, travel, and daily use.
        </p>

        <!-- Options -->
        <div class="flex mt-6 items-center pb-5 border-b border-gray-200 mb-5">
          <div class="flex items-center">
            <span class="mr-3">Color</span>
            <button class="border-2 border-gray-300 rounded-full w-6 h-6"></button>
            <button class="border-2 border-gray-300 ml-2 bg-gray-700 rounded-full w-6 h-6"></button>
            <button class="border-2 border-gray-300 ml-2 bg-yellow-500 rounded-full w-6 h-6"></button>
          </div>

          <div class="flex ml-6 items-center">
            <span class="mr-3">Size</span>
            <select class="rounded border border-gray-300 py-2 px-3">
              <option>SM</option>
              <option>M</option>
              <option>L</option>
              <option>XL</option>
            </select>
          </div>
        </div>

        <!-- Price & Buttons -->
        <div class="flex items-center gap-3">
          <span class="title-font font-medium text-2xl text-gray-900">
            $58.00
          </span>

          <button class="ml-auto text-white bg-blue-500 py-2 px-6 rounded hover:bg-blue-600">
            Buy Now
          </button>

          <button class="text-white bg-yellow-500 py-2 px-6 rounded hover:bg-yellow-600">
            Add to Cart
          </button>
        </div>
    </div>
  </div>
</section>

<!-- ===== PAYMENT SECTION ===== -->
<section class="bg-white py-12 shadow-inner">
  <h2 class="text-2xl font-bold text-center mb-6">Payment Options</h2>
  <div class="flex justify-center gap-6">
    <img class="h-12" src="https://upload.wikimedia.org/wikipedia/commons/4/41/Visa_Logo.png">
    <img class="h-12" src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png">
    <img class="h-12" src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg">
  </div>
</section>

<!-- ===== THUMBNAIL SCRIPT ===== -->
<script>
  const thumbs = document.querySelectorAll('.thumb');
  const main = document.getElementById('mainImage');

  thumbs.forEach(t => {
    t.classList.add(
      'w-14','h-14','object-contain','border',
      'rounded','cursor-pointer','transition'
    );

    t.onclick = () => {
      main.src = t.src;
      thumbs.forEach(x => x.classList.remove('ring-2','ring-yellow-500'));
      t.classList.add('ring-2','ring-yellow-500');
    };
  });
</script>

      </div>
    </div>
  </div>
</section>

</body>
</html>
