<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daraz Ecommerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<!-- ===== HEADER ===== -->
<header class="bg-white text-gray-800 body-font shadow-lg">
  <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center justify-between">
    
    <!-- Logo -->
    <a class="flex title-font font-medium items-center mb-4 md:mb-0">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"
        stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        class="w-10 h-10 text-yellow-500 p-2 bg-gray-800 rounded-full"
        viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
      </svg>
      <span class="ml-3 text-2xl font-bold">Daraz</span>
    </a>

    <!-- Navigation -->
    <nav class="flex flex-wrap items-center text-base justify-center space-x-6 md:ml-0">
      <a class="hover:text-yellow-500 transition-colors font-medium">Home</a>
      <a class="hover:text-yellow-500 transition-colors font-medium">Shop</a>
      <a class="hover:text-yellow-500 transition-colors font-medium">About</a>
      <a class="hover:text-yellow-500 transition-colors font-medium">Contact</a>
    </nav>

    <!-- Sign in button -->
    <button class="inline-flex items-center bg-yellow-500 border-0 py-2 px-6 focus:outline-none hover:bg-yellow-600 rounded text-white mt-4 md:mt-0 transition-all">
      Sign In
    </button>
  </div>
</header>

<!-- ==== Header ended ==== -->

<!-- ===== PRODUCT SECTION ===== -->
<section class="container mx-auto px-5 py-16">
  <div class="bg-white rounded-xl shadow-lg flex flex-wrap overflow-hidden">

  <!-- IMAGE -->
<div class="lg:w-1/2 w-full flex flex-col items-center bg-gray-100 p-6">

  <!-- MAIN IMAGE (FIRST CODE WALI SAME) -->
  <img
    id="mainImage"
    loading="eager"
    alt="Blue Light Glasses"
    class="w-full max-w-md object-contain rounded-lg border border-gray-300 shadow-md hover:scale-105 transition-transform mb-4"
    src="https://img.drz.lazcdn.com/g/kf/S965c0a9a0f124bef8fb484353cfdb7ceK.jpg_200x200q80.jpg_.avif">

  <!-- 5 SMALL THUMBNAILS -->
  <div class="flex gap-3 mt-4 flex-wrap justify-center">

    <img onclick="mainImage.src=this.src" loading="lazy"
      class="w-14 h-14 object-contain border rounded cursor-pointer hover:ring-2 hover:ring-yellow-500"
      src="download (1).jpg">

    <img onclick="mainImage.src=this.src" loading="lazy"
      class="w-14 h-14 object-contain border rounded cursor-pointer hover:ring-2 hover:ring-yellow-500"
      src="download 2.jpg">

    <img onclick="mainImage.src=this.src" loading="lazy"
      class="w-14 h-14 object-contain border rounded cursor-pointer hover:ring-2 hover:ring-yellow-500"
      src="download 3.jpg">

    <img onclick="mainImage.src=this.src" loading="lazy"
      class="w-14 h-14 object-contain border rounded cursor-pointer hover:ring-2 hover:ring-yellow-500"
      src="download 4.jpg">

    <img onclick="mainImage.src=this.src" loading="lazy"
      class="w-14 h-14 object-contain border rounded cursor-pointer hover:ring-2 hover:ring-yellow-500"
      src="download 5.jpg">

  </div>
</div>


    <!-- DETAILS -->
    <div class="w-full lg:w-1/2 p-8">
      <h2 class="text-sm text-gray-400">GLASSES</h2>
      <h1 class="text-3xl font-bold mb-3">
        Blue Light Filtered Glasses (UV400)
      </h1>

      <div class="text-yellow-500 mb-3">⭐⭐⭐⭐☆ <span class="text-gray-500">(4 Reviews)</span></div>

      <p class="text-gray-600 mb-5">
        Protect your eyes from harmful blue light. Comfortable, stylish & durable.
      </p>

      <!-- OPTIONS -->
      <div class="flex items-center gap-6 mb-6">
        <div>
          <span class="font-medium mr-2">Color</span>
          <button class="w-6 h-6 rounded-full border"></button>
          <button class="w-6 h-6 rounded-full bg-gray-700 border ml-1"></button>
          <button class="w-6 h-6 rounded-full bg-yellow-500 border ml-1"></button>
        </div>

        <div>
          <span class="font-medium mr-2">Size</span>
          <select class="border rounded px-3 py-1">
            <option>SM</option>
            <option>M</option>
            <option>L</option>
          </select>
        </div>
      </div>

      <!-- PRICE -->
      <div class="flex items-center gap-3">
        <span class="text-2xl font-bold">Rs. 567</span>
        <button class="ml-auto bg-blue-500 text-white px-5 py-2 rounded hover:bg-blue-600">
          Buy Now
        </button>
        <button class="bg-yellow-500 text-white px-5 py-2 rounded hover:bg-yellow-600">
          Add to Cart
        </button>
      </div>
    </div>

  </div>
</section>

<!-- ===== PAYMENT ===== -->
<section class="bg-white py-10">
  <h2 class="text-center text-xl font-bold mb-6">Payment Options</h2>
  <div class="flex justify-center gap-6">
    <img loading="lazy" class="h-10" src="https://upload.wikimedia.org/wikipedia/commons/4/41/Visa_Logo.png">
    <img loading="lazy" class="h-10" src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png">
    <img loading="lazy" class="h-10" src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg">
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="bg-gray-800 text-gray-300 text-center py-6">
  © 2026 Daraz Ecommerce — All Rights Reserved
</footer>

</body>
</html>
